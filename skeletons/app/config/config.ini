[cubo]
; qual bloco de host/database vale nesta maquina
location = local

host.local = http://localhost:8080/
host.prod = https://exemplo.com.br/

; development liga display_errors; qualquer outro valor usa o log de [app]
enviroment = development

[app]
controllers = App\Controllers\
view = App\Views\DefaultView

; relativo a raiz do projeto; aceita varios, na ordem de precedencia
templates = templates/

; Tabela de rotas declaradas. Sem ela a app roda so na convencao
; /controlador/acao/param/valor, que continua valendo mesmo com a tabela ligada.
;routes = routing/routes.php

; onde o `cubo migrate` procura as migrations
;migrations = database/migrations

; carregador de CSS/JS; os grupos sao pedidos com $view->assets('base')
;imports = public/imports.html

timezone = America/Sao_Paulo
charset = UTF-8

; Ligue apenas se houver proxy (nginx/traefik) terminando TLS na frente do PHP.
; Com isso o X-Forwarded-Proto passa a valer; sem proxy, o cabecalho e forjavel.
;trusted_proxy = 1
log = storage/logs/erro.log


; valor com = no fim (base64) precisa de aspas, senao o ini nao parseia.
;[database.local]
;dbtype = mysql
;host = 127.0.0.1
;port = 3306
;db = app
;user = ""
;pass = ""
;charset = utf8mb4
;collation = utf8mb4_unicode_ci
